<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program Linear: dari Contoh Kontekstual ke Nilai Optimum</title>
<!-- KaTeX 0.16.45 (dipatok, SRI) untuk merender rumus. Bila gagal dimuat, teks lama tetap tampil. -->
<link rel="stylesheet" id="katexCss" media="print" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.45/katex.min.css" integrity="sha384-UA8juhPf75SzzAMA/4fo3yOU7sBJ0om7SCD2GHq0fZqZco6tr1UCV7nUbk9J90JM" crossorigin="anonymous" referrerpolicy="no-referrer">
<script defer id="katexJs" src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.45/katex.min.js" integrity="sha384-Tt7wBxLKwSzFVRET4O4U9H6v8MNaQ/CjN2FMP4xFm0ErrFu6aNqoonRVW5W40iGI" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="css/gaya.css?v=2026-10-30.1">

<body data-mode="belajar">
<div class="wrap">
  <header>
    <div>
      <h1>Program Linear: dari Contoh Kontekstual ke Nilai Optimum</h1>
      <p>Matematika · Kelas X · Fase E</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" id="tombol-belajar" role="tab" data-tab="belajar" aria-selected="true">Belajar</button>
      <button class="tab" id="tombol-latihan" role="tab" data-tab="latihan" aria-selected="false">Latihan Mandiri</button>
      <button class="tab" id="tombol-kuis" role="tab" data-tab="kuis" aria-selected="false">Kuis</button>
    </div>
  </header>

  <main>
  <!-- ===================== TAB BELAJAR ===================== -->
  <section id="tab-belajar" class="tab-view" data-tab="belajar" role="tabpanel" aria-labelledby="tombol-belajar">
    <div class="layout">
      <div class="card panel"></div>
      <div class="card plane">
        <svg id="bidang-belajar" class="bidang" viewBox="0 0 460 460" role="img" aria-label="Bidang koordinat"></svg>
        <p class="cap">Daerah hijau = daerah penyelesaian (DP).</p>
      </div>
    </div>
  </section>
  <!-- ===================== TAB LATIHAN MANDIRI ===================== -->
  <section id="tab-latihan" class="tab-view" data-tab="latihan" role="tabpanel" aria-labelledby="tombol-latihan" hidden>
    <div class="card kartu">
      <div class="prob">
        <div><small class="meta"></small><div class="ask"></div></div>
        <div class="prob-actions">
          <button class="btn ghost" data-aksi="ulangi">↺ Ulangi</button>
          <button class="btn ghost" data-aksi="acak">🎲 Acak</button>
        </div>
      </div>
    </div>
    <div class="card progres"><ol class="prog"></ol><p class="steptext"></p></div>
    <div class="layout">
      <div class="card panel"></div>
      <div class="card plane">
        <svg id="bidang-latihan" class="bidang" viewBox="0 0 460 460" role="img" aria-label="Bidang koordinat"></svg>
        <p class="cap">Daerah hijau = daerah penyelesaian (DP).</p>
      </div>
    </div>
  </section>
  <!-- ===================== TAB KUIS ===================== -->
  <section id="tab-kuis" class="tab-view" data-tab="kuis" role="tabpanel" aria-labelledby="tombol-kuis" hidden>
    <div class="card kartu">
      <div class="prob">
        <div><small class="meta"></small><div class="ask"></div></div>
      </div>
    </div>
    <div class="card progres"><ol class="prog"></ol><p class="steptext"></p></div>
    <div class="layout">
      <div class="card panel"></div>
      <div class="card plane">
        <svg id="bidang-kuis" class="bidang" viewBox="0 0 460 460" role="img" aria-label="Bidang koordinat"></svg>
        <p class="cap">Daerah hijau = daerah penyelesaian (DP).</p>
      </div>
    </div>
  </section>
  </main>
</div>

<!-- Maskot Plus -->

</div>
